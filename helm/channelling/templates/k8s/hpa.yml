apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: channelling-php-hpa
  namespace: channelling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: channelling-php
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70