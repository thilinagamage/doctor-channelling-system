global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert_rules.yml"

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]
    metrics_path: /metrics

  - job_name: "channelling-php"
    static_configs:
      - targets: ["channelling-php:80"]
    metrics_path: /metrics