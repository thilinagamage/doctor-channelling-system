version: '3.8'

services:

  php-app:
    build: .
    container_name: channelling-php
    volumes:
      - .:/var/www/html
    networks:
      - channelling-net
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_NAME=channelling_db
      - DB_USER=channelling_user
      - DB_PASS=channelling_pass

  nginx:
    image: nginx:alpine
    container_name: channelling-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-app
    networks:
      - channelling-net

  mysql:
    image: mysql:8.0
    container_name: channelling-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: channelling_db
      MYSQL_USER: channelling_user
      MYSQL_PASSWORD: channelling_pass
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - channelling-net

networks:
  channelling-net:
    driver: bridge

volumes:
  db-data: